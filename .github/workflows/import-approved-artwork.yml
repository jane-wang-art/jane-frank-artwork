name: Import approved artwork once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-approved-artwork.yml']
permissions:
  contents: write
concurrency:
  group: approved-artwork-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'jane-wang-art/jane-frank-artwork'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Import and verify nine approved original images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, datetime, hashlib, io, json, os, struct, urllib.request, urllib.error, zipfile
          REPO = 'jane-wang-art/jane-frank-artwork'
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          API = 'https://api.github.com/repos/' + REPO
          ROOT = 'stories/001-autumn-terrace/'
          URL = 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-fad0-8211-9ea0-edae23e50823/raw?se=2026-09-26T07%3A50%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=3df9b938-88ee-5e56-910a-a3ffce0acce2&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T23%3A20%3A15Z&ske=2026-09-26T23%3A20%3A15Z&sks=b&skv=2026-02-06&sig=ykVUTqHToY82GTKjyhgwBf3AcnzahJErHZV99GDkSRY%3D'
          print('::add-mask::' + URL)
          req = urllib.request.Request(URL, headers={'User-Agent': 'Mozilla/5.0', 'Accept': '*/*'})
          try:
              with urllib.request.urlopen(req, timeout=90) as r:
                  archive = r.read(20000001)
          except urllib.error.HTTPError as e:
              print('Transfer error', e.code, e.read(3000).decode(errors='replace'))
              raise SystemExit(1)
          assert hashlib.sha256(archive).hexdigest() == '8fb23d0b7e4f3b146a04bfa0bc195c48a0681cbf2000024e6675cf4b3a3ca636', 'Archive integrity check failed'
          files = {}
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert len(z.infolist()) == 9 and set(z.namelist()) == {f'{n:02}.png' for n in range(1,10)}
              for name in sorted(z.namelist()):
                  assert z.getinfo(name).file_size < 3000000
                  data = z.read(name)
                  assert data.startswith(b'\x89PNG\r\n\x1a\n')
                  files[ROOT + 'publication-exports/' + name] = data
          def api(path, obj=None, method=None):
              data = None if obj is None else json.dumps(obj).encode()
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'approved-artwork-import'}
              req = urllib.request.Request(API+path, data=data, headers=headers, method=method or ('GET' if obj is None else 'POST'))
              try:
                  with urllib.request.urlopen(req, timeout=90) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  print('GitHub operation failed:', path, e.code, e.read(2000).decode(errors='replace'))
                  raise SystemExit(1)
          records, entries = [], []
          for path, data in files.items():
              sha = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              blob = api('/git/blobs', {'content':base64.b64encode(data).decode(), 'encoding':'base64'})
              assert blob['sha'] == sha
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
              w,h = struct.unpack('>II',data[16:24])
              records.append({'asset_id':'FJM-001-'+path[-6:-4]+'-v001','path':path,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob_sha':sha,'width':w,'height':h})
              print('Uploaded and verified:',path)
          metadata = {'title':'Autumn Terrace / 秋日露台','author_credit':'Jane Wang','copyright_identity':'jane-wang-art','source_repository':'https://github.com/'+REPO,'process':'AI-assisted artwork developed from user-provided designs, story direction and iterative feedback; selected files imported unchanged.','publication_authorization':'Owner explicitly approved public upload of this nine-image set and designated this repository.','imported_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'original_creation_date':None,'note':'Import time is not creation time; hashes record integrity, not copyright registration or conclusive authorship.','images':records}
          entries.append({'path':ROOT+'metadata.json','mode':'100644','type':'blob','content':json.dumps(metadata,ensure_ascii=False,indent=2)+'\n'})
          entries.append({'path':ROOT+'SHA256SUMS.txt','mode':'100644','type':'blob','content':''.join(r['sha256']+'  '+r['path'].split(ROOT,1)[1]+'\n' for r in records)})
          parent = api('/git/ref/heads/main')['object']['sha']
          commit = api('/git/commits/'+parent)
          current = api('/git/trees/'+commit['tree']['sha']+'?recursive=1')
          assert not current.get('truncated')
          old = {x['path']:x['sha'] for x in current['tree']}
          for entry in entries:
              if entry['path'] in old: assert entry.get('sha') == old[entry['path']], 'Refusing to overwrite an existing different file'
          tree = api('/git/trees',{'base_tree':commit['tree']['sha'],'tree':entries})
          new = api('/git/commits',{'message':'art: publish nine original terrace images credited to Jane Wang','tree':tree['sha'],'parents':[parent]})
          api('/git/refs/heads/main',{'sha':new['sha'],'force':False},'PATCH')
          verified = api('/git/trees/'+tree['sha']+'?recursive=1')
          actual = {x['path']:x['sha'] for x in verified['tree']}
          assert all(actual[r['path']] == r['git_blob_sha'] for r in records)
          print('Nine original PNGs committed and verified:',new['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Nine unchanged PNGs published. Commit: `'+new['sha']+'`\n')
          PY
